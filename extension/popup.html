<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rust AdBlocker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 16px;
      text-align: center;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
    }
    .header .subtitle {
      font-size: 11px;
      color: #8899aa;
      margin-top: 2px;
    }
    .status-bar {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    .status-bar.enabled { background: #0d4228; color: #4ade80; }
    .status-bar.disabled { background: #451a1a; color: #f87171; }

    .stats {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: #16213e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-card .value {
      font-size: 22px;
      font-weight: 700;
      color: #e94560;
    }
    .stat-card .label {
      font-size: 10px;
      color: #8899aa;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filters-info {
      padding: 0 16px 12px;
      font-size: 11px;
      color: #6b7b8d;
      text-align: center;
    }

    .actions {
      padding: 0 16px 16px;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    #toggleButton {
      background: #e94560;
      color: white;
    }
    #toggleButton.off {
      background: #4ade80;
      color: #0d4228;
    }
    #optionsButton {
      background: #16213e;
      color: #8899aa;
      border: 1px solid #2a3a5e;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🛡️ Rust AdBlocker</h2>
    <div class="subtitle">Powered by Rust + WebAssembly</div>
  </div>

  <div id="status" class="status-bar enabled">Protection Active</div>

  <div class="stats">
    <div class="stat-card">
      <div class="value" id="blockedCount">0</div>
      <div class="label">Blocked Today</div>
    </div>
    <div class="stat-card">
      <div class="value" id="totalBlocked">0</div>
      <div class="label">Total Blocked</div>
    </div>
  </div>

  <div class="filters-info" id="filtersInfo">Loading filters...</div>

  <div class="actions">
    <button id="toggleButton">Disable</button>
    <button id="optionsButton">⚙ Options</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
